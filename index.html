<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- <body class="bg-slate-100 m-10"> -->
<body class="bg-black m-10">
    
    <!-- colorfull circles bnaye -->
    <div class="absolute  w-50 h-50 rounded-full bg-purple-800 blur-3xl"></div>
    <div class="absolute left-[300px] -z-10 w-20 h-20 rounded-full bg-orange-300 blur-3xl"></div>
    <div class="absolute top-[200px] left-[300px] -z-10 w-50 h-50 rounded-full bg-pink-800 blur-3xl"></div>
    <div class="absolute top-[300px] left-[50px] -z-10 w-20 h-20 rounded-full bg-green-400 blur-3xl"></div>
    <div class="absolute top-[450px] left-[150px] -z-10 w-50 h-50 rounded-full bg-teal-400 blur-3xl"></div>
    <div class="absolute left-[1000px] w-50 h-50 rounded-full bg-amber-200 blur-3xl"></div>
    <div class="absolute left-[800px] top-[300px] -z-10 w-50 h-50 rounded-full bg-teal-400 blur-3xl"></div>
    <div class="absolute left-[550px] top-[400px] -z-10 w-30 h-30 rounded-full bg-rose-500 blur-3xl"></div>
    <div class="absolute left-[1100px] top-[400px] w-30 h-30 rounded-full bg-fuchsia-600 blur-3xl"></div>
    <div class="absolute left-[850px] w-15 h-15 rounded-full bg-red-400 blur-3xl"></div>
    

    <!-- new code----------------------- -->

    <div class="bg-white max-w-md mx-auto rounded-lg">
        <div class="bg-pink-600 p-5 rounded-t-xl">
            <h1 class="text-2xl font-bold tracking-wide text-white">Todo App</h1>
        </div>

        <div class="p-5">
            <form id="todo-form" action="" class="flex flex-col mb-6">
                <div class="flex gap-5 mb-1">
                    <input id="todo-input" placeholder="Enter task description..."
                        class="border p-2 flex-1 border-slate-300 rounded-lg " type="text" name="" id="" type="text">
                    <button id="form-btn"
                        class=" px-5 py-1 text-white bg-pink-600 rounded-lg transition-all duration-300 ease-in-out hover:bg-pink-600   hover:scale-y-105 hover:shadow-[0_0_15px_rgba(239,68,68,0.7)] cursor-pointer "
                        onfocus="this.style.backgroundColor='#ec4899'; this.style.outline='none';"
                       >Add</button>
                </div>
                <button type="button" id="cancel-btn"
                    class="hidden self-end text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer">Cancel
                    Editing</button>
            </form>

            <div class="flex justify-between pt-5 pb-2 text-xs border-b border-slate-200 text-slate-500">
                <p id="task-count">TASKS (0)</p>
                <p id="complete-count">COMPLETED : 0</p>
            </div>

            <ul class="py-5 flex flex-col gap-3" id="todo-list">
                <!-- Todo template -->
                <!-- <li data-id="1" class="flex gap-2 border border-slate-300 p-4 rounded-xl">
                    <input type="checkbox">
                    <p class="flex-1">Test Todo</p>
                    <div class="flex gap-2">
                        <button>Edit</button>
                        <button>Delete</button>
                    </div>
                </li> -->


            </ul>

            <div id="empty-state" class="hidden text-center pt-2 pb-7 text-slate-400">
                <p class="text-sm"></p>
            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>

</html>
