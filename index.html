<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- <body class="bg-slate-100 m-10"> -->
<body class="bg-black m-4 md:m-10 overflow-x-hidden relative min-h-screen">
    
    <!-- colorfull circles bnaye -->
    <div class="absolute left-[650px] top-[20px] w-60 h-60 rounded-full bg-slate-400 blur-3xl"></div>
    <div class="absolute left-[450px] top-[20px] w-30 h-30 rounded-full bg-cyan-800 blur-3xl"></div>
    <div class="absolute  w-50 h-50 rounded-full bg-purple-800 blur-3xl"></div>
    <div class="absolute left-[300px] -z-10 w-20 h-20 rounded-full bg-orange-300 blur-3xl"></div>
    <div class="absolute top-[200px] left-[300px] -z-10 w-50 h-50 rounded-full bg-pink-800 blur-3xl"></div>
    <div class="absolute top-[300px] left-[50px] -z-10 w-20 h-20 rounded-full bg-green-400 blur-3xl"></div>
    <div class="absolute top-[450px] left-[150px] -z-10 w-50 h-50 rounded-full bg-teal-400 blur-3xl"></div>
    <div class="absolute left-[1000px] w-50 h-50 rounded-full bg-amber-200 blur-3xl"></div>
    <div class="absolute left-[800px] top-[300px] -z-10 w-50 h-50 rounded-full bg-teal-400 blur-3xl"></div>
    <div class="absolute left-[550px] top-[400px] -z-10 w-30 h-30 rounded-full bg-rose-500 blur-3xl"></div>
    <div class="absolute left-[1100px] top-[400px] w-30 h-30 rounded-full bg-fuchsia-600 blur-3xl"></div>
    <div class="absolute left-[850px] w-15 h-15 rounded-full bg-red-400 blur-3xl"></div>
    

    <!-- main code----------------------- -->

    <div class="mt-10 md:mt-24 mx-auto w-full max-w-md bg-[#0d0e12]/60 backdrop-blur-2xl border border-white/5 rounded-[24px] shadow-[0_25px_70px_-15px_rgba(0,0,0,0.8)] overflow-hidden z-10 relative">
        <div class="p-6 pb-4  overflow-hidden  border-b border-white/[0.04]">
            <h1 class="text-2xl font-800 tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Todo App</h1> 
        </div>

        <div class="p-5">
            <form id="todo-form" action="" class="flex flex-col mb-6"> 
                <div class="flex gap-3 mb-1 items-center bg-white/[0.03] border border-white/5 p-1.5 rounded-xl focus-within:border-cyan-500/40 focus-within:bg-white/[0.05] focus-within:shadow-[0_0_20px_rgba(6,182,212,0.1)] transition-all duration-300"> 
                    <input id="todo-input" placeholder="Create a new mission..." class="bg-transparent pl-3 pr-2 py-1.5 flex-1 text-white placeholder-slate-500 focus:outline-none text-sm font-500" type="text"> 
<button id="form-btn" type="submit" class="px-5 py-2 font-600 text-xs tracking-wider uppercase text-black bg-gradient-to-r from-cyan-400 to-emerald-400 rounded-lg transition-all duration-300 hover:opacity-90 hover:scale-[1.03] active:scale-95 shadow-[0_4px_15px_rgba(6,182,212,0.3)] cursor-pointer">Add</button> 
                </div> 
                <button type="button" id="cancel-btn" class="hidden self-end text-xs text-slate-400 hover:text-white underline cursor-pointer mt-2 transition-all">Cancel Editing</button> 
            </form> 

            <div class="flex justify-between pt-5 pb-2 text-xs border-b border-slate-200/7 ">
                <p id="task-count" class="bg-white/[0.06] text-slate-300 px-2 py-0.5 rounded-full text-[10px]">TASKS (0)</p>
                <p id="complete-count"  class="bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-full text-[10px]" >COMPLETED : 0</p>
            </div>

            <ul class="py-5 flex flex-col gap-3 " id="todo-list">
                <!-- Todo template -->
                <!-- <li data-id="1" class="flex gap-2 border border-slate-300 p-4 rounded-xl">
                    <input type="checkbox">
                    <p class="flex-1">Test Todo</p>
                    <div class="flex gap-2">
                        <button>Edit</button>
                        <button>Delete</button>
                    </div>
                </li> -->


            </ul>

             <div id="empty-state" class="text-center py-8 text-slate-500 border border-dashed border-white/[0.03] rounded-xl bg-white/[0.01] "> 
                <p></p> 
            </div> 
        </div>

                    <!-- Name inside Todo Card at the bottom center -->
            <div class="flex items-center justify-center gap-1.5 text-[11px] pt-2 mt-2 mb-2 border-t border-white/[0.04]">
                <span class="text-slate-500 font-normal text-[10px]">Designed & Coded by</span>
                <span class="text-pink-400 font-extrabold text-[10px] tracking-wider border-b border-pink-500/30 pb-0.5 shadow-pink-500/10 drop-shadow-sm">
                    ✨ GAGANDEEP KAUR
                </span>
            </div>


    </div>


    <script src="index.js"></script>
</body>

</html>
